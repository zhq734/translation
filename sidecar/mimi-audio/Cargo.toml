[package]
name = "mimi-audio-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Audio capture and realtime ASR sidecar for realtime subtitle translation (ported from Mimi, MIT)."
license = "MIT"
authors = ["yuxino <nbsawz@gmail.com>", "zhenghq"]

[[bin]]
name = "mimi-audio-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "url"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", features = ["sink"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rubato = "5"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
block2 = "0.6"
screen-capture-kit = "0.7.1"
core-media = "0.8"
core-graphics2 = { version = "0.6", features = ["display"] }
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
objc2-core-audio-types = { version = "0.3", features = ["objc2"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-foundation = { version = "0.3", features = ["CFDictionary"] }
libc = "0.2"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSError", "NSObject", "NSBundle"] }
dispatch2 = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
