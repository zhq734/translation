<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="screenshot.longCapture.title">Long screenshot</title>
    <script src="./localeBootstrap.js"></script>
    <script src="./themeBootstrap.js"></script>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/base.css" />
    <link rel="stylesheet" href="./src/longCapture.css" />
  </head>
  <body>
    <main class="long-capture-panel" data-i18n-attr="aria-label:screenshot.longCapture.title" aria-label="Long screenshot">
      <span class="long-capture-mark" aria-hidden="true">↕</span>
      <div class="long-capture-summary">
        <span id="long-capture-sampling" class="long-capture-status-text" role="status" aria-live="polite" data-i18n="screenshot.longCapture.waiting">Waiting for scroll</span>
        <span class="long-capture-metrics">
          <span><span data-i18n="screenshot.longCapture.frames">Frames</span> <strong id="long-capture-frames">0</strong></span>
          <span><span data-i18n="screenshot.longCapture.height">Height</span> <strong id="long-capture-height">0 px</strong></span>
          <span id="long-capture-offset-wrap"><span data-i18n="screenshot.longCapture.offset">Last offset</span> <strong id="long-capture-offset">0 px</strong></span>
        </span>
        <p id="long-capture-status" class="long-capture-status" role="status" aria-live="polite"></p>
      </div>
      <div class="long-capture-actions">
        <button id="long-capture-sample" type="button" data-i18n="screenshot.longCapture.sample">Capture now</button>
        <button id="long-capture-undo" type="button" data-i18n="screenshot.longCapture.undo">Undo</button>
        <button id="long-capture-cancel" type="button" data-i18n="common.cancel">Cancel</button>
        <button id="long-capture-save" type="button" data-i18n="screenshot.longCapture.save">Save</button>
        <button id="long-capture-copy" class="primary" type="button" data-i18n="screenshot.longCapture.copy">Copy</button>
      </div>
    </main>
    <script type="module" src="./src/longCapture.ts"></script>
  </body>
</html>
