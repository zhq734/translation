<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="screenshot.pin.windowTitle">Pinned screenshot</title>
    <script src="./localeBootstrap.js"></script>
    <script src="./themeBootstrap.js"></script>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/base.css" />
    <link rel="stylesheet" href="./src/pin.css" />
  </head>
  <body>
    <main id="pin-root" class="pin-root" data-i18n-attr="aria-label:screenshot.pin.windowTitle" aria-label="Pinned screenshot">
      <img
        id="pin-image"
        class="pin-image"
        alt="Pinned screenshot"
        data-i18n-attr="alt:screenshot.pin.windowTitle"
        draggable="false"
      />
    </main>
    <script type="module" src="./src/pin.ts"></script>
  </body>
</html>
