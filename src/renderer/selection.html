<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <title>翻译选中文字 / OCR 框选</title>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/selection.css" />
  </head>
  <body>
    <button id="translate" title="翻译选中文字" aria-label="翻译选中文字">译</button>
    <main id="ocr-overlay" class="ocr-overlay" aria-label="OCR 截图框选" hidden>
      <img id="ocr-snapshot" class="ocr-snapshot" alt="" draggable="false" />
      <canvas id="ocr-annotation-canvas" class="ocr-annotation-canvas" aria-hidden="true"></canvas>
      <canvas id="ocr-annotation-preview" class="ocr-annotation-preview" aria-hidden="true"></canvas>
      <div class="ocr-tip">拖拽选择区域，可移动或拉伸，点击识别开始 OCR，按 Esc 取消</div>
      <div id="ocr-selection-box" class="ocr-selection-box" hidden>
        <span class="ocr-resize-handle" data-handle="nw" aria-hidden="true"></span>
        <span class="ocr-resize-handle" data-handle="n" aria-hidden="true"></span>
        <span class="ocr-resize-handle" data-handle="ne" aria-hidden="true"></span>
        <span class="ocr-resize-handle" data-handle="e" aria-hidden="true"></span>
        <span class="ocr-resize-handle" data-handle="se" aria-hidden="true"></span>
        <span class="ocr-resize-handle" data-handle="s" aria-hidden="true"></span>
        <span class="ocr-resize-handle" data-handle="sw" aria-hidden="true"></span>
        <span class="ocr-resize-handle" data-handle="w" aria-hidden="true"></span>
      </div>
      <div id="ocr-toolbar" class="ocr-toolbar" hidden>
        <div class="ocr-toolbar-group" data-group="annotation-tools" role="group" aria-label="标注工具">
          <button id="ocr-tool-rect" type="button" title="矩形" aria-label="矩形" aria-pressed="false" data-annotation-tool="rect">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="4.5" width="14" height="11" rx="1.5"></rect>
            </svg>
          </button>
          <button id="ocr-tool-ellipse" type="button" title="椭圆" aria-label="椭圆" aria-pressed="false" data-annotation-tool="ellipse">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
              <ellipse cx="10" cy="10" rx="7" ry="5.5"></ellipse>
            </svg>
          </button>
          <button id="ocr-tool-arrow" type="button" title="箭头" aria-label="箭头" aria-pressed="false" data-annotation-tool="arrow">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16L16 4M9.5 4H16v6.5"></path>
            </svg>
          </button>
          <button id="ocr-tool-brush" type="button" title="画笔" aria-label="画笔" aria-pressed="false" data-annotation-tool="brush">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16c2.5-.3 3.6-1.4 4.6-3.4l5.2-5.2a1.8 1.8 0 0 0-2.5-2.5L6 10.2C4.4 11.2 3.5 12.4 3.2 15z"></path>
              <path d="M12.6 5.6l1.8 1.8"></path>
            </svg>
          </button>
          <button id="ocr-tool-text" type="button" title="文字" aria-label="文字" aria-pressed="false" data-annotation-tool="text">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M5 5h10M10 5v10M7.5 15h5"></path>
            </svg>
          </button>
          <button id="ocr-tool-mosaic" type="button" title="马赛克" aria-label="马赛克" aria-pressed="false" data-annotation-tool="mosaic">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="currentColor">
              <rect x="3" y="3" width="4" height="4"></rect><rect x="8" y="3" width="4" height="4"></rect><rect x="13" y="3" width="4" height="4"></rect>
              <rect x="3" y="8" width="4" height="4"></rect><rect x="8" y="8" width="4" height="4"></rect><rect x="13" y="8" width="4" height="4"></rect>
              <rect x="3" y="13" width="4" height="4"></rect><rect x="8" y="13" width="4" height="4"></rect><rect x="13" y="13" width="4" height="4"></rect>
            </svg>
          </button>
          <button id="ocr-undo" type="button" title="撤销标注" aria-label="撤销" disabled>
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 5L3.5 8.5 7 12"></path><path d="M3.5 8.5H12a4.5 4.5 0 0 1 0 9H9"></path>
            </svg>
          </button>
          <button id="ocr-redo" type="button" title="重做标注" aria-label="重做" disabled>
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 5l3.5 3.5L13 12"></path><path d="M16.5 8.5H8a4.5 4.5 0 0 0 0 9h3"></path>
            </svg>
          </button>
          <button id="ocr-clear-annotations" type="button" title="清空标注" aria-label="清空标注" disabled>
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h12M8 7V5h4v2M6 7l.7 9h6.6L14 7"></path>
            </svg>
          </button>
        </div>
        <div class="ocr-toolbar-group" data-group="annotation-style" role="group" aria-label="标注样式">
          <button id="ocr-color-toggle" type="button" title="标注颜色" aria-label="标注颜色">
            <span id="ocr-color-indicator" class="ocr-color-indicator"></span>
          </button>
          <div id="ocr-color-panel" class="ocr-color-panel" hidden role="dialog" aria-label="选择标注颜色">
            <button type="button" class="ocr-color-swatch" data-color="#ff3b30" title="红色" aria-label="红色"></button>
            <button type="button" class="ocr-color-swatch" data-color="#ff9500" title="橙色" aria-label="橙色"></button>
            <button type="button" class="ocr-color-swatch" data-color="#ffcc00" title="黄色" aria-label="黄色"></button>
            <button type="button" class="ocr-color-swatch" data-color="#34c759" title="绿色" aria-label="绿色"></button>
            <button type="button" class="ocr-color-swatch" data-color="#0a84ff" title="蓝色" aria-label="蓝色"></button>
            <button type="button" class="ocr-color-swatch" data-color="#5e5ce6" title="紫色" aria-label="紫色"></button>
            <input id="ocr-color-custom" type="color" value="#ff3b30" aria-label="自定义标注颜色" title="自定义标注颜色" />
          </div>
          <input id="ocr-stroke-width" type="range" min="1" max="16" step="1" value="3" aria-label="线条粗细" title="线条粗细" />
          <input id="ocr-font-size" type="range" min="12" max="48" step="1" value="18" aria-label="文字字号" title="文字字号" hidden />
          <button id="ocr-text-bold" type="button" title="文字加粗" aria-label="文字加粗" aria-pressed="false" hidden><strong>B</strong></button>
          <input id="ocr-mosaic-brush" type="range" min="12" max="80" step="1" value="28" aria-label="马赛克笔刷大小" title="马赛克笔刷大小" hidden />
          <input id="ocr-mosaic-intensity" type="range" min="1" max="3" step="1" value="2" list="ocr-mosaic-intensity-levels" aria-label="马赛克强度" title="马赛克强度" hidden />
          <datalist id="ocr-mosaic-intensity-levels">
            <option value="1" label="弱"></option>
            <option value="2" label="中"></option>
            <option value="3" label="强"></option>
          </datalist>
        </div>
        <div class="ocr-toolbar-group" data-group="screenshot-actions" role="group" aria-label="截图动作">
          <button id="ocr-recognize" type="button" title="文字识别" aria-label="文字识别">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="3" width="15" height="14" rx="2"></rect>
              <path d="M6 8h8M6 11.5h8M6 15h5"></path>
            </svg>
          </button>
          <button id="ocr-translate" type="button" title="翻译" aria-label="翻译">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 5h7M6.5 3v2M4.5 5c.8 2.8 2.8 5 5 6.2M8.5 5c-.8 2.8-2.8 5-5 6.2"></path>
              <path d="M11 17l3.2-7 3.3 7M12.2 14.6h4.1"></path>
            </svg>
          </button>
          <button id="ocr-copy-image" type="button" title="复制图片" aria-label="复制图片">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6.5" y="6.5" width="10" height="10" rx="2"></rect>
              <path d="M13.5 4.5v-1a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"></path>
            </svg>
          </button>
          <button id="ocr-save-image" type="button" title="保存到本地" aria-label="保存到本地">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 2.5v9M6.8 8.3L10 11.5l3.2-3.2"></path>
              <path d="M3.5 12.5v3a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3"></path>
            </svg>
          </button>
          <button id="ocr-cancel" type="button" title="取消" aria-label="取消">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 5l10 10M15 5L5 15"></path>
            </svg>
          </button>
        </div>
      </div>
      <textarea id="ocr-text-input" class="ocr-text-input" aria-label="标注文字内容" maxlength="200" rows="1" hidden></textarea>
      <aside id="ocr-panel" class="ocr-panel" hidden aria-label="OCR 识别结果">
        <div id="ocr-panel-status" class="ocr-panel-status" role="status"></div>
        <textarea id="ocr-panel-text" class="ocr-panel-text" readonly aria-label="OCR 原文"></textarea>
        <span id="ocr-panel-resize" class="ocr-panel-resize" role="separator" aria-label="调整识别结果区域大小" aria-hidden="true"></span>
      </aside>
      <div id="ocr-tooltip" class="ocr-tooltip" role="tooltip" hidden></div>
    </main>
    <script type="module" src="./src/selection.ts"></script>
  </body>
</html>
