<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="screenshot.longCapture.preview">Live preview</title>
    <script src="./localeBootstrap.js"></script>
    <script src="./themeBootstrap.js"></script>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/base.css" />
    <link rel="stylesheet" href="./src/longPreview.css" />
  </head>
  <body>
    <main class="long-preview" data-i18n-attr="aria-label:screenshot.longCapture.preview" aria-label="Live preview">
      <div class="long-preview-empty" aria-hidden="true">⇕</div>
      <img id="long-preview-image" class="long-preview-image" alt="" data-i18n-attr="alt:screenshot.longCapture.preview" hidden />
    </main>
    <script type="module" src="./src/longPreview.ts"></script>
  </body>
</html>
