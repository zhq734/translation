<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="webReader.windowTitle">Web Translation</title>
    <script src="./localeBootstrap.js"></script>
    <script src="./themeBootstrap.js"></script>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/base.css" />
    <link rel="stylesheet" href="./src/webReader.css" />
  </head>
  <body>
    <main class="web-reader-shell">
      <header id="web-reader-titlebar" class="window-titlebar" data-i18n-attr="aria-label:webReader.titlebar" aria-label="Web translation window title bar">
        <div class="window-titlebar-brand" data-i18n-attr="aria-label:webReader.brand" aria-label="Selection Translator web translation">
          <span class="window-titlebar-mark" aria-hidden="true">译</span>
          <span class="window-titlebar-title" data-i18n="webReader.windowTitle">Web Translation</span>
        </div>
        <div class="window-controls" data-i18n-attr="aria-label:common.windowControls" aria-label="Window controls">
          <button id="window-minimize" class="window-control-button" type="button" data-i18n-attr="aria-label:common.minimize;title:common.minimize" aria-label="Minimize" title="Minimize">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" /></svg>
          </button>
          <button id="window-maximize" class="window-control-button" type="button" data-i18n-attr="aria-label:common.maximize;title:common.maximize" aria-label="Maximize" title="Maximize">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" /></svg>
          </button>
          <button id="window-close" class="window-control-button window-control-close" type="button" data-i18n-attr="aria-label:common.close;title:common.close" aria-label="Close" title="Close">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" /></svg>
          </button>
        </div>
      </header>
      <header class="web-toolbar" data-i18n-attr="aria-label:webReader.navigationToolbar" aria-label="Web translation navigation toolbar">
        <div class="web-navigation-actions">
          <button id="web-back" class="icon-button" type="button" data-i18n-attr="title:webReader.back;aria-label:webReader.back" title="Back" disabled aria-label="Back">←</button>
          <button id="web-forward" class="icon-button" type="button" data-i18n-attr="title:webReader.forward;aria-label:webReader.forward" title="Forward" disabled aria-label="Forward">→</button>
          <button id="web-reload" class="icon-button" type="button" data-i18n-attr="title:webReader.reload;aria-label:webReader.reload" title="Reload" aria-label="Reload">↻</button>
        </div>
        <form id="web-address-form" class="web-address-form">
          <input id="web-address" type="text" inputmode="url" autocomplete="url" spellcheck="false" data-i18n-attr="aria-label:webReader.address;placeholder:webReader.addressPlaceholder" aria-label="Web address" placeholder="Enter a web address, for example example.com" />
        </form>
        <label class="web-language-control"><span data-i18n="menu.sourceLanguage">Source Language</span>
          <select id="web-source-lang" data-i18n-attr="aria-label:menu.sourceLanguage" aria-label="Source Language"></select>
        </label>
        <span class="language-arrow" aria-hidden="true">→</span>
        <label class="web-language-control"><span data-i18n="menu.targetLanguage">Target Language</span>
          <select id="web-target-lang" data-i18n-attr="aria-label:menu.targetLanguage" aria-label="Target Language"></select>
        </label>
        <button id="web-translate" class="primary-button" type="button" data-i18n="webReader.translatePage">Translate Page</button>
        <button id="web-cancel" class="secondary-button" type="button" data-i18n="common.cancel" disabled>Cancel</button>
        <label class="web-mode-control"><span data-i18n="webReader.display">Display</span>
          <select id="web-mode" data-i18n-attr="aria-label:webReader.displayMode" aria-label="Web page display mode">
            <option value="target" data-i18n="webReader.mode.target">Translation</option>
            <option value="source" data-i18n="webReader.mode.source">Original</option>
            <option value="bilingual" data-i18n="webReader.mode.bilingual">Bilingual</option>
          </select>
        </label>
      </header>
      <div id="web-loading-progress" class="web-loading-progress" role="progressbar" data-i18n-attr="aria-label:webReader.loadingProgress" aria-label="Web page loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden></div>
      <div id="web-status" class="web-status" role="status" aria-live="polite" data-i18n="webReader.enterAddress">Enter a web address</div>
      <section id="web-view-slot" class="web-view-slot" data-i18n-attr="aria-label:webReader.contentArea" aria-label="Web page content area"></section>
    </main>
    <script type="module" src="./src/webReader.ts"></script>
  </body>
</html>
