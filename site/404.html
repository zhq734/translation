<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>页面不存在 — 划词翻译</title>
  <style>
    :root { color-scheme: light dark; font-family: "Avenir Next", "Segoe UI", "PingFang SC", sans-serif; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f7f8fb; color: #172033; }
    main { width: min(520px, calc(100% - 40px)); padding: 48px; border: 1px solid #e5e8ef; border-radius: 24px; background: #fff; box-shadow: 0 24px 70px rgba(35, 58, 99, .12); }
    p:first-child { margin: 0; color: #1558c8; font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 14px 0 10px; font-size: 42px; letter-spacing: -.05em; }
    p { color: #69748a; line-height: 1.7; }
    a { display: inline-flex; margin-top: 18px; padding: 11px 16px; border-radius: 10px; background: #172033; color: #fff; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1017; color: #f2f5fb; }
      main { border-color: #29303e; background: #151a24; }
      p:first-child { color: #a8c8ff; }
      p { color: #a5afc1; }
      a { background: #f2f5fb; color: #151a24; }
    }
  </style>
</head>
<body>
  <main>
    <p>404 · NOT FOUND</p>
    <h1>这里没有页面。</h1>
    <p>链接可能已经失效，或者地址输入有误。返回首页继续了解划词翻译。</p>
    <a href="/translation/">返回首页</a>
  </main>
</body>
</html>
