name: 多平台打包

on:
  workflow_dispatch:
    inputs:
      version:
        description: 可选版本号，例如 V1.0.3；留空时使用 package.json 中的版本
        required: false
        type: string
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 测试与类型检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm test

      - name: 运行类型检查
        run: npm run typecheck

  package:
    name: 打包 ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
            command: dist:mac:ci
            artifact_name: packages-macos
            artifact_path: |
              dist/SelectionTranslator-*-mac-*.dmg
              dist/SelectionTranslator-*-mac-*.zip
              dist/latest*.yml
              dist/*.blockmap
          - name: Windows
            os: windows-2025
            command: dist:win
            artifact_name: packages-windows
            artifact_path: |
              dist/SelectionTranslator-*-Setup-*.exe
              dist/latest*.yml
              dist/*.blockmap
          - name: Linux
            os: ubuntu-24.04
            command: dist:linux
            artifact_name: packages-linux
            artifact_path: |
              dist/SelectionTranslator-*-linux-*.AppImage
              dist/latest*.yml
              dist/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 同步发布版本
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: 校验并准备 macOS 签名与公证凭据
        if: matrix.name == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          missing=()
          for variable in \
            MACOS_CERTIFICATE_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '缺少 macOS 发布凭据: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: 构建 macOS 安装包
        if: matrix.name == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run ${{ matrix.command }}

      - name: 构建非 macOS 安装包
        if: matrix.name != 'macOS'
        run: npm run ${{ matrix.command }}

      - name: 验证 macOS 签名、公证与 Gatekeeper 状态
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/划词翻译.app)
          if (( ${#apps[@]} == 0 )); then
            echo '未找到待验证的 macOS 应用包' >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            signature_details="$(codesign -dv --verbose=4 "$app" 2>&1)"
            if ! grep -q '^Authority=Developer ID Application:' <<< "$signature_details"; then
              echo "macOS 应用未使用 Developer ID Application 签名: $app" >&2
              printf '%s\n' "$signature_details" >&2
              exit 1
            fi
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 下载全部安装包
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true

      - name: 生成 SHA-256 校验和
        run: node scripts/generate-checksums.mjs --directory release-assets

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_RELEASE=false
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
            NEW_RELEASE=true
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          if [[ "$NEW_RELEASE" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
