name: 多平台打包

on:
  workflow_dispatch:
    inputs:
      version:
        description: 可选版本号，例如 V1.0.3；留空时使用 package.json 中的版本
        required: false
        type: string
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 测试与类型检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm test

      - name: 运行类型检查
        run: npm run typecheck

  package:
    name: 打包 ${{ matrix.name }}
    needs: verify
    env:
      USAGE_SMTP_USER: ${{ secrets.USAGE_SMTP_USER }}
      USAGE_SMTP_PASS: ${{ secrets.USAGE_SMTP_PASS }}
      USAGE_REPORT_TO: ${{ secrets.USAGE_REPORT_TO }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            platform: macos
            arch: x64
            os: macos-15-intel
            command: dist:mac:x64:ci
            unsigned_command: dist:mac:x64:unsigned
            artifact_name: packages-macos-x64
            artifact_path: |
              dist/SelectionTranslator-*-mac-x64.dmg
              dist/SelectionTranslator-*-mac-x64.zip
              dist/latest-mac-x64.yml
              dist/*.blockmap
          - name: macOS arm64
            platform: macos
            arch: arm64
            os: macos-14
            command: dist:mac:arm64:ci
            unsigned_command: dist:mac:arm64:unsigned
            artifact_name: packages-macos-arm64
            artifact_path: |
              dist/SelectionTranslator-*-mac-arm64.dmg
              dist/SelectionTranslator-*-mac-arm64.zip
              dist/latest-mac-arm64.yml
              dist/*.blockmap
          - name: Windows
            platform: windows
            os: windows-2025
            command: dist:win
            artifact_name: packages-windows
            artifact_path: |
              dist/SelectionTranslator-*-Setup-*.exe
              dist/latest*.yml
              dist/*.blockmap
          - name: Linux
            platform: linux
            os: ubuntu-24.04
            command: dist:linux
            artifact_name: packages-linux
            artifact_path: |
              dist/SelectionTranslator-*-linux-*.AppImage
              dist/latest*.yml
              dist/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 同步发布版本
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: 生成构建元数据
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/generate-build-info.mjs --output build/build-info.json

      - name: 生成使用量统计上报配置
        shell: bash
        env:
          USAGE_SMTP_USER: ${{ secrets.USAGE_SMTP_USER }}
          USAGE_SMTP_PASS: ${{ secrets.USAGE_SMTP_PASS }}
          USAGE_REPORT_TO: ${{ secrets.USAGE_REPORT_TO }}
        run: node scripts/generate-usage-report-config.mjs

      - name: 检查并准备 macOS 签名与公证凭据
        if: matrix.platform == 'macos'
        id: macos_signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          missing=()
          for variable in \
            MACOS_CERTIFICATE_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} == 0 )); then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo 'macOS 发布凭据完整，将执行 Developer ID 签名、Apple 公证和 Gatekeeper 验证。'
          elif (( ${#missing[@]} == 5 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo '未配置 macOS 发布凭据，将继续生成未签名安装包。'
            {
              echo '### ⚠️ macOS 未签名安装包'
              echo
              echo '本次运行未配置 Apple 发布凭据，macOS 产物不支持应用内自动安装。'
              echo '请从 Release 下载 DMG、拖入“应用程序”并覆盖旧版本；首次打开前请按 README 处理 Gatekeeper 隔离属性。'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'macOS 发布凭据配置不完整，缺少: %s\n' "${missing[*]}" >&2
            echo '请补齐全部五个 Secret，或删除已配置的部分 Secret 以生成未签名安装包。' >&2
            exit 1
          fi

      - name: 构建已签名 macOS 安装包
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run ${{ matrix.command }}

      - name: 构建未签名 macOS 安装包
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.unsigned_command }}

      - name: 构建非 macOS 安装包
        if: matrix.platform != 'macos'
        run: npm run ${{ matrix.command }}

      - name: 校验使用量统计上报配置
        run: |
          node scripts/validate-usage-report-config.mjs --output build/usage-report-config.json

      - name: 区分 macOS 架构更新清单
        if: matrix.platform == 'macos'
        shell: bash
        run: mv dist/latest-mac.yml "dist/latest-mac-${{ matrix.arch }}.yml"

      - name: 验证 macOS 签名、公证与 Gatekeeper 状态
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/划词翻译.app)
          if (( ${#apps[@]} == 0 )); then
            echo '未找到待验证的 macOS 应用包' >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            signature_details="$(codesign -dv --verbose=4 "$app" 2>&1)"
            if ! grep -q '^Authority=Developer ID Application:' <<< "$signature_details"; then
              echo "macOS 应用未使用 Developer ID Application 签名: $app" >&2
              printf '%s\n' "$signature_details" >&2
              exit 1
            fi
            if ! grep -q '^TeamIdentifier=499QMYBXLR$' <<< "$signature_details"; then
              echo "macOS 应用签名团队不是预期的 TeamIdentifier=499QMYBXLR: $app" >&2
              printf '%s\n' "$signature_details" >&2
              exit 1
            fi
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 下载全部安装包
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true

      - name: 生成 SHA-256 校验和
        run: node scripts/generate-checksums.mjs --directory release-assets

      - name: 合并 macOS 双架构更新清单
        run: node scripts/merge-mac-update-info.mjs --directory release-assets

      - name: 生成并校验 Release 构建元数据
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/generate-build-info.mjs --output release-assets/build-info.json
          node scripts/generate-build-info.mjs --output release-assets/build-info.json --check
          VERSION="$(node -e "process.stdout.write(require('./release-assets/build-info.json').version)")"
          shopt -s nullglob
          installers=(release-assets/SelectionTranslator-"$VERSION"-*)
          if (( ${#installers[@]} == 0 )); then
            echo "构建元数据版本 $VERSION 与本次安装包不一致，拒绝发布过期元数据" >&2
            exit 1
          fi

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_RELEASE=false
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
            NEW_RELEASE=true
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          if [[ "$NEW_RELEASE" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
